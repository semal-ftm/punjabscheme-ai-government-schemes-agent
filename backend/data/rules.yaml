  - id: cm-e-bikes-scheme
    name: CM e-Bikes Scheme
    category: cm_punjab
    level: provincial
    department: Government of the Punjab
    phase: "Phase 2 (2026)"
    sector: Youth / Transport
    summary: >-
      Electric bikes for college and university students on monthly instalments with government-paid
      interest and insurance. Phase 2 was announced for 2026; the application window must be confirmed on
      the official portal.
    source_url: https://punjab.gov.pk/cm-ebikes-scheme
    last_verified: 2026-11-01
    status: Unverified
    criteria:
      - id: age
        field: age
        op: gte
        value: 18
        label: At least 18 years old
        quote: Eligible applicants must be at least 18 years old
      - id: enrolled
        field: currently_enrolled
        op: is_true
        label: Regular student
        quote: be regular students of degree colleges or universities recognized by the Higher Education Commission (HEC)
      - id: level
        field: education_level
        op: in
        value: [undergraduate, graduate, postgraduate]
        label: Student of an HEC-recognised degree college or university
        quote: be regular students of degree colleges or universities recognized by the Higher Education Commission (HEC)
