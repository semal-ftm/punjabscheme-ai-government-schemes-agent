  - id: apni-chhat-apna-ghar
    name: Apni Chhat Apna Ghar Program
    category: cm_punjab
    level: provincial
    department: Punjab Housing & Town Planning Agency (HUD&PHED)
    sector: Housing
    summary: >-
      Help for low-income families living in rented or informal housing to build their own house on a
      small plot they own (100,000 affordable houses planned).
    source_url: https://punjab.gov.pk/apni-chhat-apna-ghar
    application_url: https://acag.punjab.gov.pk/index.aspx
    last_verified: 2026-11-01
    status: Unverified
    criteria:
      - id: residency
        field: province
        op: eq
        value: punjab
        label: Permanent resident of Punjab
        quote: Applicant is a permanent resident of Punjab as per his/her CNIC
      - id: owns_plot
        field: owns_plot
        op: is_true
        label: Sole owner of the plot where the house will be built
        quote: Applicant is sole owner and possessor of a parcel of land measuring 5 Marla or less in urban areas and land upto 10 Marla in rural areas
      - id: plot_urban
        field: plot_size_marla
        op: lte
        value: 5
        when: {field: area_type, op: eq, value: urban}
        label: Plot of 5 marla or less (urban)
        quote: Applicant is sole owner and possessor of a parcel of land measuring 5 Marla or less in urban areas and land upto 10 Marla in rural areas
      - id: plot_rural
        field: plot_size_marla
        op: lte
        value: 10
        when: {field: area_type, op: eq, value: rural}
        label: Plot up to 10 marla (rural)
        quote: Applicant is sole owner and possessor of a parcel of land measuring 5 Marla or less in urban areas and land upto 10 Marla in rural areas
      - id: head_of_family
        op: manual
        label: Head of the nucleus family as per NADRA record
        quote: Applicant is a head of his/her beta (nucleus) family as per NADRA record
      - id: nser
        op: manual
        label: Registered in NSER with household PMT score of 60 or less
        quote: Applicant is registered with National Socio-Economic Registry (NSER) in a household having a PMT score of 60 or less
      - id: criminal_record
        op: manual
        label: No criminal record
        quote: Applicant should not have a criminal record
      - id: no_default
        op: manual
        label: Not a loan defaulter
        quote: Applicant should not be a loan defaulter of any financial institution/ bank etc.
    benefits:
      - text: Support to build an affordable house (100,000 houses planned across Punjab)
        quote: This scheme aims to provide 100,000 affordable Houses / Apartments to eligible residents in all areas of the province
    steps:
      - text: Apply by filling the Citizen Registration Form on the official portal
        quote: Apply for Apni Chhat Apna Ghar Program by filling Citizen Registration Form

