        label: No conviction in heinous criminal offences
        quote: No conviction or involvement in heinous criminal offenses
    benefits:
      - text: "Roof repair / structural reinforcement: up to PKR 500,000 (repay in up to 3 years)"
        quote: "Maximum Financing: Up to PKR 500,000"
      - text: "Home expansion: up to PKR 1,000,000 (repay in up to 6 years)"
        quote: "Maximum Financing: Up to PKR 1,000,000"
