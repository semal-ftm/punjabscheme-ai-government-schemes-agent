    category: punjab_department
    level: provincial
    department: Punjab Workers Welfare Fund (PWWF)
    sector: Education
    summary: >-
      Education fees reimbursed plus monthly allowances for children of registered industrial and mining
      workers, from intermediate level up to postgraduate study. Apply online within one year of admission.
    source_url: https://pwwf.punjab.gov.pk/scholarship
    application_url: https://mis.pwwf.punjab.gov.pk/
    last_verified: 2026-11-12
    status: Unverified
    criteria:
      - id: worker
        op: manual
        label: Parent is an industrial/mining worker registered with EOBI or Social Security, with at least 3 years of service
        quote: must be registered with EOBI or Social Security and having at least 3 years accumulative service
      - id: contributions
        op: manual
        label: At least nine months of EOBI or PESSI contributions in the last twelve months
        quote: having at least nine months contribution of EOBI or PESSI out of last twelve months
      - id: establishment
        op: manual
        label: Employer registered under the Factories Act 1934 or Punjab Mining Concession Rules 2002
        quote: must be registered under Factories Act, 1934 or Punjab Mining Concession Rules, 2002.
      - id: enrolled
        field: currently_enrolled
        op: is_true
        label: Student currently admitted (apply within one year of admission)
        quote: lication can be submitted within one year from the date of admission.
    benefits:
      - text: Intermediate fees reimbursed up to Rs 100,000 a year
        quote: For intermediate / Inter Tech / A-level and equivalent programs as per actual or Rs.100,000/- per annum, whichever is lower.
      - text: Boarding (hostel and mess) Rs 10,000 a month where admissible
        quote: Boarding charges (Hostel+Mess) @ Rs.10,000/- per month.
      - text: Transport Rs 5,000 a month where admissible
        quote: Transport charges @ Rs.5,000/- per month.
    documents:
      - text: Employment certificate, affidavit on stamp paper, bank cheque leaf or certificate, and original fee vouchers
        quote: upload Employement Certificate, Affidavit on Stamp Paper, Cheque Leaf / Certificate of Bank particulars and Fee Payment Vouchers in original
    steps:
      - text: Sign up on the PWWF MIS portal with the student's CNIC or B-Form
        quote: "Register/Sign-up (With Student CNIC/B-Form) through the link: www.mis.pwwf.punjab.gov.pk"
      - text: Track your application on the portal
        quote: Keep checking your portal to see the status of your application.

  - id: bisp-benazir-kafaalat
    name: Benazir Kafaalat Programme (BISP)
    category: federal
    level: federal
    department: Benazir Income Support Programme (Federal)
    sector: Social Protection
    summary: >-
      Unconditional quarterly cash transfer to women of poor households identified through the National
      Socio-Economic Registry (NSER) survey.
    source_url: https://bisp.gov.pk/Detail/YTgzNjkxM2YtN2ViMC00MjA5LWI0MDMtNzM4ZWJmMGVlNzc5
    last_verified: 2026-11-01
    status: Unverified
    criteria:
      - id: woman
        field: gender
        op: in
        value: [female, transgender]
        label: Woman of the household (transgender persons included under BISP policy)
        quote: Only an ever married female with valid CNIC and cleared from profiling in an eligible household will be declared as beneficiary.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
      - id: ever_married
        field: marital_status
        op: in
        value: [married, widowed, divorced]
        when: {field: gender, op: eq, value: female}
        label: Ever-married woman
        quote: Only an ever married female with valid CNIC and cleared from profiling in an eligible household will be declared as beneficiary.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
      - id: pmt
        op: manual
        label: Household PMT score within the cut-off (32; 37 with a differently-abled member) via NSER survey
        quote: The current PMT cut-off score of 32 was approved by the BISP Board
    benefits:
      - text: Rs. 8,500 per beneficiary per quarter (as stated on the official page)
        quote: the present Benazir Kafaalat stipend is Rs. 8,500/- per beneficiary per quarter
    documents:
      - text: Original CNIC for biometric verification when receiving payments
        quote: along with her original CNIC to receive the first installment through biometric verification
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
    steps:
      - text: Check your eligibility status with your CNIC on the 8171 portal
        quote: CNIC can be checked on 8171 portal to check the eligibility status of an individual.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
      - text: If there is no record, an adult household member visits the Benazir registration desk at the BISP Tehsil Office for a household survey
        quote: any adult member of the household may visit nearest Benazir registration desk, established at BISP Tehsil Office, for household survey.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf

  - id: bisp-taleemi-wazaif
    name: Benazir Taleemi Wazaif (BISP)
    category: federal
    level: federal
    department: Benazir Income Support Programme (Federal)
    sector: Education
    summary: >-
      Conditional education stipends for children of active Benazir Kafaalat beneficiaries, from primary
      up to higher secondary level.
    source_url: https://bisp.gov.pk/Detail/YzNlY2Q2ZGYtNjIwZS00MjNiLWFhMmEtZGM5NWNkMjZhMjQ3
    last_verified: 2026-11-01
    status: Unverified
    criteria:
      - id: kafaalat_family
        field: bisp_beneficiary
        op: is_true
        label: Child of an active BISP Kafaalat beneficiary
        quote: Children of active BISP Kafalat Beneficiary
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
      - id: level
        field: education_level
        op: in
        value: [primary, middle, matric, intermediate]
        label: Studying at primary, secondary or higher secondary level
        quote: for education of children of BISP active Kafalat beneficiaries up to higher secondary level
      - id: age_primary
        field: age
        op: between
        value: [4, 12]
        when: {field: education_level, op: eq, value: primary}
        label: Age 4-12 for primary education
        quote: Age criteria of child is 4-12 years for enrollment in Primary Education
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
      - id: age_secondary
        field: age
        op: between
        value: [8, 18]
        when: {field: education_level, op: in, value: [middle, matric]}
        label: Age 8-18 for secondary education
        quote: Age criteria of child is 8-18 years for enrollment in Secondary Education
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
      - id: age_higher_secondary
        field: age
        op: between
        value: [13, 22]
        when: {field: education_level, op: eq, value: intermediate}
        label: Age 13-22 for higher secondary education
        quote: Age criteria of child is 13-22 years for enrollment in Higher Secondary Education
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
    documents:
      - text: CNIC of the beneficiary (mother)
        quote: CNIC of the beneficiary
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
      - text: Child's B-form / CRC issued by NADRA
        quote: B-form/CRC issued by NADRA
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
      - text: School admission slip with class and school name, verified by the teacher
        quote: School admission slip containing information of class, school name verified by the teacher
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
    steps:
      - text: Visit an enrolment camp / BISP field office with the child and documents
        quote: Beneficiary has to visit enrolment camp/field offices
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf
      - text: Or enrol through BISP's digital self-enrolment application
        quote: A digital application is established for self -enrollment.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/Taleemi%20Wazaif_09162022.pdf

  - id: pm-youth-business-agri-loan
    name: PM Youth Business & Agriculture Loan Scheme (PMYB&ALS)
    category: federal
    level: federal
    department: Prime Minister's Youth Programme
    sector: Business / Agriculture
    summary: >-
      Business and agriculture loans in three tiers (up to Rs 7.5 million, 0-7% markup) for young Pakistani
      residents, issued through 15 commercial, Islamic and SME banks. Applications are online only.
    source_url: https://pmybals.pmyp.gov.pk/
    application_url: https://pmyp.gov.pk/bankform/newapplicantform
    last_verified: 2026-11-12
    status: Unverified
    criteria:
      - id: age
        field: age
        op: between
        value: [21, 45]
        label: Aged 21 to 45 (18 to 45 for IT / e-commerce businesses)
        quote: All Pakistani residents, aged between 21 and 45 years with entrepreneurial potential are eligible to apply for the loan.
      - id: not_government
        field: employment_type
        op: not_in
        value: [government_employee]
        label: Not a government employee
        quote: Government employees are not eligible from applying under this scheme.
      - id: resident
        op: manual
        label: Resident Pakistani
        quote: This scheme is only for resident Pakistanis.
    benefits:
      - text: "Tier 1: up to Rs 0.5 million at 0% markup"
        quote: The range is 0.5 million PKR with 0% markup
      - text: "Tier 2: Rs 0.5 to 1.5 million at 5% markup"
        quote: The range is above 0.5 Million upto 1.5 Million PKR with 5% markup
      - text: "Tier 3: Rs 1.5 to 7.5 million at 7% markup"
        quote: The range is above 1.5 Million upto 7.5 Million PKR with 7% markup
    steps:
      - text: Apply online only, on the official PMYP loan form
        quote: Applications have to be submitted online only through our website.
