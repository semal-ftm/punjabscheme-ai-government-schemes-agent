    category: punjab_department
    level: provincial
    department: Punjab Social Protection Authority (PSPA)
    sector: Education
    summary: >-
      Monthly stipend for girl students of grades 6-10 in government schools of selected low-literacy
      districts, linked to 80% attendance.
    source_url: https://pspa.punjab.gov.pk/zewar-e-taleem-program
    last_verified: 2026-11-01
    status: Unverified
    criteria:
      - id: girl
        field: gender
        op: eq
        value: female
        label: Girl student
        quote: conditional cash transfer to the girl students enrolled in public sector schools
      - id: enrolled
        field: currently_enrolled
        op: is_true
        label: Currently enrolled in school
        quote: conditional cash transfer to the girl students enrolled in public sector schools
      - id: public
        field: institution_type
        op: eq
        value: public
        label: Government (public sector) school
        quote: conditional cash transfer to the girl students enrolled in public sector schools
      - id: grade
        field: education_level
        op: in
        value: [middle, matric]
        label: Grades 6 to 10
        quote: from 6th to 10th grade
      - id: district
        field: district
        op: in
        value: [bahawalnagar, bahawalpur, bhakkar, chiniot, dera ghazi khan, jhang, kasur, khanewal, kot addu,
                layyah, lodhran, muzaffargarh, okara, pakpattan, rajanpur, rahim yar khan, vehari]
        label: School in one of the listed districts
        quote: Bahawalnagar, Bahawalpur, Bhakkar, Chinniot, DG Khan, Jhang, Kasur, Khanewal, Kot Addu, Layyah, Lodhran, Muzaffargarh, Okara, Pakpattan, Rajanpur, Rahim Yar Khan and Vehari districts
      - id: attendance
        op: manual
        label: 80% school attendance (reported by School Education Department)
        quote: funds are released on receipt of 80% attendance report from School Education Department
    benefits:
      - text: Rs 1,000 monthly stipend (released quarterly)
        quote: Rs.1000 monthly stipend is being given to the girls of government schools

