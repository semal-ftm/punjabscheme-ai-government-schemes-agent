    application_url: https://acag.punjab.gov.pk/index.aspx
    last_verified: 2026-11-01
    status: Unverified
    criteria:
      - id: residency
        field: province
        op: eq
        value: punjab
        label: Permanent resident of Punjab
        quote: The applicant must be a permanent resident of Punjab holding a valid Computerized National Identity Card (CNIC)
      - id: owns_home
        field: owns_plot
        op: is_true
        label: Owns a residential plot or home
        quote: Ownership of a residential land plot or home measuring up to 5 Marla in urban areas or 10 Marla in rural areas
      - id: plot_urban
        field: plot_size_marla
        op: lte
        value: 5
        when: {field: area_type, op: eq, value: urban}
        label: Up to 5 marla (urban)
        quote: Ownership of a residential land plot or home measuring up to 5 Marla in urban areas or 10 Marla in rural areas
      - id: plot_rural
        field: plot_size_marla
        op: lte
        value: 10
        when: {field: area_type, op: eq, value: rural}
        label: Up to 10 marla (rural)
        quote: Ownership of a residential land plot or home measuring up to 5 Marla in urban areas or 10 Marla in rural areas
