  # ======================================================== FEDERAL PROGRAMMES (available in Punjab)
  - id: bisp-benazir-kafaalat
    name: Benazir Kafaalat Programme (BISP)
    category: federal
    level: federal
    department: Benazir Income Support Programme (Federal)
    sector: Social Protection
    summary: >-
      Unconditional quarterly cash transfer to women of poor households identified through the National
      Socio-Economic Registry (NSER) survey.
    source_url: https://bisp.gov.pk/Detail/YTgzNjkxM2YtN2ViMC00MjA5LWI0MDMtNzM4ZWJmMGVlNzc5
    last_verified: 2026-11-01
    status: Unverified
    criteria:
      - id: woman
        field: gender
        op: in
        value: [female, transgender]
        label: Woman of the household (transgender persons included under BISP policy)
        quote: Only an ever married female with valid CNIC and cleared from profiling in an eligible household will be declared as beneficiary.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
      - id: ever_married
        field: marital_status
        op: in
        value: [married, widowed, divorced]
        when: {field: gender, op: eq, value: female}
        label: Ever-married woman
        quote: Only an ever married female with valid CNIC and cleared from profiling in an eligible household will be declared as beneficiary.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
      - id: pmt
        op: manual
        label: Household PMT score within the cut-off (32; 37 with a differently-abled member) via NSER survey
        quote: The current PMT cut-off score of 32 was approved by the BISP Board
    benefits:
      - text: Rs. 8,500 per beneficiary per quarter (as stated on the official page)
        quote: the present Benazir Kafaalat stipend is Rs. 8,500/- per beneficiary per quarter
    documents:
      - text: Original CNIC for biometric verification when receiving payments
        quote: along with her original CNIC to receive the first installment through biometric verification
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
    steps:
      - text: Check your eligibility status with your CNIC on the 8171 portal
        quote: CNIC can be checked on 8171 portal to check the eligibility status of an individual.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf
      - text: If there is no record, an adult household member visits the Benazir registration desk at the BISP Tehsil Office for a household survey
        quote: any adult member of the household may visit nearest Benazir registration desk, established at BISP Tehsil Office, for household survey.
        source_url: https://bisp.gov.pk/SiteImage/Misc/files/KifalatEngUrdu_2022.pdf

