# Human-verified eligibility rules for PunjabScheme AI.
#
# Every criterion / benefit / document / step quotes the official page VERBATIM (`quote`) and names its
# `source_url`. `python -m app.cli verify-quotes` and tests/test_source_accuracy.py check each quote still
# appears in the saved official snapshot.
#
# Operators: eq | in | not_in | between | lt | gt | lte | gte | is_true | is_false | manual
#   manual = a condition only the scheme authority can confirm (PMT score, criminal record, merit...).
#   when   = the criterion only applies if the condition holds (e.g. plot limit for urban areas).
# status stays "Unverified" unless an official page states the application window (status_quote + dates).
#
# Re-verification workflow: when the crawler flags a changed source, read the diff on the Updates page,
# edit the affected entry, set last_verified to today (or a date-time like 2026-11-02T10:00 for a
# same-day re-check) and run:  python -m app.cli reload-rules

schemes:
  # ======================================================== CM PUNJAB INITIATIVES (provincial)
  - id: cm-honhaar-scholarship
    name: Chief Minister Honhaar Scholarship Program
    category: cm_punjab
    level: provincial
    department: Government of the Punjab / Punjab Higher Education Commission
    phase: "Phase-IV (Fall 2026)"
    sector: Education
    summary: >-
      Full tuition-fee scholarships on merit for undergraduate students of selected disciplines. Phase-IV
      covers 1st-semester students (Fall 2026) at selected public, HED, federal and partner private
      institutions, and 2nd-semester-onward students at public sector institutions. The portal banner gives
      the deadline as 19 November 2026; its FAQ still says 9 November 2026, so confirm on the portal.
    source_url: https://honhaarscholarship.punjabhec.gov.pk/
    application_url: https://honhaarscholarship.punjabhec.gov.pk/
    last_verified: 2026-11-12
    status: Open
    status_quote: New Registration is now open for Punjab students
    status_source_url: https://honhaarscholarship.punjabhec.gov.pk/
    deadline: 2026-11-19
    criteria:
      - id: domicile
        field: province
        op: eq
        value: punjab
        label: Punjab domicile
        quote: Have domicile of Punjab province
      - id: income_public
        field: monthly_household_income
        op: lt
        value: 350000
        when: {field: institution_type, op: eq, value: public}
        label: Family monthly income below Rs 350,000 (public sector institutions)
        quote: Monthly Family income of the applicant must be less than Rs. 350,000/- for Public Sector HEIs and Rs. 500,000 for Federal / Private Sector HEIs
      - id: income_private
        field: monthly_household_income
        op: lt
        value: 500000
        when: {field: institution_type, op: eq, value: private}
        label: Family monthly income below Rs 500,000 (federal / private institutions)
        quote: Monthly Family income of the applicant must be less than Rs. 350,000/- for Public Sector HEIs and Rs. 500,000 for Federal / Private Sector HEIs
      - id: level
        field: education_level
        op: eq
        value: undergraduate
        label: Enrolled in an undergraduate programme (selected disciplines)
        quote: The applicant must be enrolled in the 1st semester/year of Selected Disciplines in the Selected Universities / Colleges in 2026.
      - id: enrolled
        field: currently_enrolled
        op: is_true
        label: Currently enrolled
        quote: The applicant must be enrolled in the 1st semester/year of Selected Disciplines in the Selected Universities / Colleges in 2026.
      - id: senior_public_only
        field: institution_type
        op: eq
        value: public
        when: {field: current_semester, op: gte, value: 2}
        label: From 2nd semester onward, only public sector institutions
        quote: The eligibility of students enrolled in the 2nd semester/year onward is limited to the public sector institutions specified under Phase-IV.
      - id: marks
        field: intermediate_marks_percent
        op: gte
        value: 60
        label: Intermediate marks at least 60% (lowest bar, HED colleges Arts); most institutions need 65-80%
        quote: "1st Semester / 1st Year: At least 65% marks in Sciences and 60% in Arts and Social Sciences."
      - id: merit
        op: manual
        label: Selected discipline, institution-specific marks and merit-based selection (confirmed by the authority)
        quote: Scholarships will be awarded on merit basis.
    benefits:
      - text: 100% tuition fees covered
        quote: 100% tuition fee coverage.
    documents:
      - text: Affidavit on e-stamp paper about family income
        quote: (Affidavit on E-Stamp Required)
    steps:
      - text: Register online on the Honhaar portal before the deadline
        quote: Application Deadline November 19, 2026

